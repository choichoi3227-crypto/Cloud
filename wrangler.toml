name = "cloudpress"
main = "src/worker.js"
compatibility_date = "2026-06-25"
workers_dev = true

[vars]
APP_NAME = "클라우드프레스"
PRIMARY_DOMAIN = "cloud-press.co.kr"
SESSION_TTL_SECONDS = "86400"
# COOKIE_DOMAIN should be set to .your-root-domain in production so sso sessions work across bridge and console.
COOKIE_DOMAIN = "bridge.cloud-press.co.kr, sso.cloud-press.co.kr, bridge-console.cloud-press.co.kr"

# Set with wrangler secret put: JWT_SECRET, ADMIN_EMAIL,
# GOOGLE_CLIENT_ID, KAKAO_REST_API_KEY, NAVER_CLIENT_ID, FIREBASE_API_KEY,
# CLOUDFLARE_GLOBAL_API_KEY, CLOUDFLARE_ADMIN_EMAIL,
# GITHUB_OWNER, GITHUB_REPO, GITHUB_TOKEN, GITHUB_BRANCH(선택)
#
# ADMIN_EMAIL: 이 이메일과 일치하는 사용자는 가입 시점뿐 아니라 매 로그인 시점에도
# 항상 admin 권한을 갖습니다. (구버전 호환: ADMIN_BOOTSTRAP_EMAIL도 계속 동작합니다)
# 예: wrangler secret put ADMIN_EMAIL
#
# ---- 데이터 영속성 (Cloudflare KV/D1/R2/Durable Objects 미사용) ----
# CloudPressKV/CloudPressSQL/CP3는 100% 자체 제작 엔진으로 동작하며,
# 메인 저장소는 Worker 메모리(즉시 반영), 서브 백업은 아래 GitHub repo의
# data/snapshot.json 파일입니다. Worker가 재시작되면 이 파일에서 자동 복원됩니다.
#
# GITHUB_OWNER : 예) choichoi3227-crypto
# GITHUB_REPO  : 예) Cloud   (이 레포의 data/ 폴더에 snapshot.json이 commit 됩니다)
# GITHUB_TOKEN : GitHub Personal Access Token (해당 레포에 대한 Contents 읽기/쓰기 권한 필요)
# GITHUB_BRANCH: 선택, 기본값 main
#
# 등록 예시:
#   wrangler secret put GITHUB_OWNER
#   wrangler secret put GITHUB_REPO
#   wrangler secret put GITHUB_TOKEN
#
# 위 3개를 등록하지 않으면 GitHub 백업 없이 메모리에만 저장됩니다(개발/테스트용).

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
