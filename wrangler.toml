name = "cloudpress"
main = "src/worker.js"
compatibility_date = "2026-06-25"
workers_dev = true

[vars]
APP_NAME = "클라우드프레스"
PRIMARY_DOMAIN = "cloud-press.co.kr"
SESSION_TTL_SECONDS = "86400"
# COOKIE_DOMAIN: sso 서브도메인에서 발급한 세션이 console 서브도메인에서도 동작하려면
# 루트 도메인(예: .cloud-press.co.kr)으로 설정해야 합니다.
# wrangler secret put 으로 설정하거나 여기서 직접 지정합니다.
COOKIE_DOMAIN = ".cloud-press.co.kr"

# ── 필수 Worker Secrets (wrangler secret put 으로 등록) ──────────────
#
# [영속성 스토리지 — CloudPressDB + CP3 GitHub 백엔드]
# GITHUB_OWNER  : GitHub 사용자명 또는 조직명 (예: choichoi3227-crypto)
# GITHUB_REPO   : 저장소명 (예: Cloud)
# GITHUB_TOKEN  : Personal Access Token (Contents 읽기/쓰기 권한)
# GITHUB_BRANCH : 브랜치명 (기본값: main)
#
#   wrangler secret put GITHUB_OWNER
#   wrangler secret put GITHUB_REPO
#   wrangler secret put GITHUB_TOKEN
#
# [보안]
# JWT_SECRET    : 세션 서명 HMAC 키 (무작위 긴 문자열)
# ADMIN_EMAIL   : 항상 admin 권한을 갖는 이메일
#
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_EMAIL
#
# [선택 — 소셜 로그인]
# GOOGLE_CLIENT_ID
# KAKAO_REST_API_KEY
# NAVER_CLIENT_ID

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
